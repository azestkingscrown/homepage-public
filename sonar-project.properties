sonar.projectKey=homepage
sonar.projectName=homepage
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src,static

# Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/.svelte-kit/**,**/build/**,**/public/uploads/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.svg,**/*.ico

# Coverage & Static Doc Layout Boilerplate Exclusions
sonar.coverage.exclusions=**/*
sonar.cpd.exclusions=static/docs/**/*.html

# TypeScript / JavaScript settings
sonar.javascript.environments=browser,node
sonar.sourceEncoding=UTF-8
