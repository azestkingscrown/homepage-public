<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azest_Kingscrown</title>
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
    />
    <script nonce="%sveltekit.nonce%">
      (function () {
        var t = "system";
        try {
          t = localStorage.getItem("theme") || "system";
        } catch (err) {
          console.debug(err);
        }
        var prefersDark = Boolean(
          window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches,
        );
        if (t === "dark" || (t === "system" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="min-h-screen bg-gray-50 text-gray-900 antialiased selection:bg-indigo-100 selection:text-indigo-700 dark:bg-gray-950 dark:text-gray-50 dark:selection:bg-indigo-500/30 dark:selection:text-indigo-200"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
